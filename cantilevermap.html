<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f2e8">
<title>Cantilever Map</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#18313a;background:#f8f2e8;font-synthesis:none;--ink:#18313a;--muted:#75868a;--line:#dce3df;--teal:#147c83;--cream:#fffdf8;--orange:#f1763b}
*{box-sizing:border-box}
body{margin:0;min-width:340px;min-height:100vh;background:#f8f2e8}
.app{width:calc(100vw - 32px);height:calc(100vh - 32px);min-height:500px;margin:16px auto;padding:10px;display:grid;grid-template-columns:310px 300px minmax(0,1fr);gap:9px}
.panel{min-width:0;min-height:0;background:var(--cream);border:2px solid var(--ink);border-radius:10px;padding:12px}
.controls{display:flex;flex-direction:column;justify-content:space-between;gap:5px;overflow:hidden;padding:8px}
h1{font-size:16px;margin:0 0 2px}h2{font-size:14px;margin:0}
label{display:block;margin:1px 0 2px;color:#405961;font-size:10px;font-weight:700}
input,select{width:100%;height:38px;border:1px solid #cbd6d3;border-radius:4px;padding:4px 7px;font:inherit;font-size:11px;color:var(--ink);background:#fff;outline:none}
input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 2px #147c8318}
.field{min-width:0}.size-grid{display:grid;grid-template-columns:1fr;gap:8px}
.font-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.font-grid input{height:36px}
.font-grid label{font-size:9px;line-height:1.15;min-height:21px;white-space:nowrap}
button,.nav-link,.file-label{min-height:42px;border:1px solid var(--ink);border-radius:4px;padding:7px 8px;background:#f1eee6;color:var(--ink);font:inherit;font-size:10px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
button:hover,.nav-link:hover{filter:brightness(.96);box-shadow:2px 2px 0 #18313a22}
.file-label{display:block;min-height:42px;background:#e4f3e9;color:#286b46;border:1px dashed #91aaa5}.file-label input{display:none}
.fit{background:#e3f1ee}.export{background:#e2f0ee;color:#126e74}.clear{background:#f1763b;color:white;border-color:#c65b2b}
.nav-link{display:block;background:#f0ecdf}
.control-section{border-top:1px solid var(--line);padding-top:5px}.section-title{font-size:10px;font-weight:750;margin:0 0 5px;color:#294347}.probe-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}.probe-choice{min-height:38px;padding:5px 6px;display:flex;align-items:center;gap:6px;text-align:left;background:#f8f7f2;border:1px solid #cbd6d3;border-radius:4px}.probe-choice.active{background:#fff2d6;border:2px solid var(--ink);box-shadow:0 0 0 2px #dfbd6345}.probe-dot{width:10px;height:10px;flex:none;border-radius:50%;background:var(--probe-color);border:1px solid #18313a55}.direction-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.direction-choice{min-height:37px;padding:4px 2px;background:#f8f7f2;border:1px solid #cbd6d3}.direction-choice.active{background:#e3f1ee;border:2px solid var(--teal);box-shadow:0 0 0 2px #147c8320}.length-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}.length-option{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px;align-items:center}.length-pick{min-height:34px;padding:3px;background:#f2f4ef;border-color:#bdcdc8}.length-pick.active{background:#e3f1ee;border:2px solid var(--teal)}.length-option input{height:34px;padding:3px 5px;font-size:10px}.mode-button.active{background:#df3f45;color:#fff;border-color:#bd2730}.mode-button{background:#e7f2f5;color:#285b70}
.excel-panel{display:flex;flex-direction:column;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:7px;margin:0 0 8px;min-height:25px}.table-wrap{flex:1;min-height:0;overflow:auto;border:1px solid #b9c9c4;background:#fff}.excel-table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed;font-size:10px}.excel-table th{position:sticky;top:0;z-index:1;background:#edf5f1;color:#405961;padding:4px 3px;border:1px solid #bdcdc8}.excel-table td{height:15px;line-height:12px;padding:1px 4px;border:1px solid #d4dfda;text-align:center;white-space:nowrap;overflow:hidden}.excel-table tbody tr{cursor:pointer}.excel-table tbody tr.selected td{background:#fff0a6}.excel-table td:first-child{width:34px;background:#f5f7f5;color:#607176}.badge{border-radius:9px;padding:4px 7px;background:#e5f2ee;color:#147c83;font-size:10px;font-weight:700;white-space:nowrap}
.readout{border-top:1px solid var(--line);padding-top:8px;font-size:11px;line-height:1.7;color:#405961}
.readout b{color:var(--ink)}.status{display:none}
.drawing{display:flex;flex-direction:column;overflow:hidden}.drawing-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;min-height:25px}.head-actions{display:flex;align-items:center;gap:7px}.drawing-area{flex:1;min-height:0;position:relative;overflow:hidden;border:1px solid #d8e1dc;background:#fffdf8}canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}canvas.dragging{cursor:grabbing}
@media(max-height:850px) and (min-width:901px){.controls{gap:4px}input,select{height:30px}.font-grid input{height:29px}button,.nav-link,.file-label{min-height:34px;padding:6px 8px}.file-label{min-height:34px}.probe-choice{min-height:30px;padding:4px 6px}.direction-choice{min-height:29px}.length-pick,.length-option input{min-height:27px;height:27px}}
@media(max-width:900px){.app{height:auto;min-height:100vh;grid-template-columns:1fr;grid-template-rows:minmax(360px,1fr) auto minmax(420px,1fr);margin:0;width:100%;padding:8px}.excel-panel{order:1}.controls{order:2}.drawing{order:3}.panel{min-height:360px}}
</style>
</head>
<body>
<main class="app" aria-label="Cantilever Map">
  <section class="panel excel-panel" aria-label="Bảng tọa độ Excel">
    <div class="panel-head"><h2>Excel</h2><span id="padCount" class="badge">0 pad</span></div>
    <div class="table-wrap"><table class="excel-table" aria-label="Tọa độ Cantilever"><thead><tr><th style="width:34px">STT</th><th id="xHead">X (um)</th><th id="yHead">Y (um)</th><th>Pad number</th><th>Pad name</th></tr></thead><tbody id="excelRows"></tbody></table></div>
  </section>
  <aside class="panel controls" aria-label="Chức năng">
    <h2>Chức năng</h2>
    <label class="file-label">⇧ Chọn file CSV<input id="csvFile" type="file" accept=".csv,text/csv,text/plain"></label>
    <div class="field"><label for="padSize">Kích thước pad vuông (um)</label><input id="padSize" value="50" inputmode="decimal"></div>
    <div class="font-grid"><div class="field"><label for="nameTextSize">Cỡ chữ pad name (um)</label><input id="nameTextSize" value="100" inputmode="decimal"></div><div class="field"><label for="numberTextSize">Cỡ chữ pad number (um)</label><input id="numberTextSize" value="80" inputmode="decimal"></div></div>
    <section class="control-section" aria-label="Phân loại probe"><h2 class="section-title">Phân loại probe</h2><div class="probe-grid" id="probeGrid">
      <button class="probe-choice" type="button" data-probe="0"><span class="probe-dot" style="--probe-color:#e34b4b"></span>Probe 1</button>
      <button class="probe-choice" type="button" data-probe="1"><span class="probe-dot" style="--probe-color:#3978c5"></span>Probe 2</button>
      <button class="probe-choice" type="button" data-probe="2"><span class="probe-dot" style="--probe-color:#43a66b"></span>Probe 3</button>
      <button class="probe-choice" type="button" data-probe="3"><span class="probe-dot" style="--probe-color:#e89932"></span>Probe 4</button>
      <button class="probe-choice" type="button" data-probe="4"><span class="probe-dot" style="--probe-color:#9b64c5"></span>Probe 5</button>
      <button class="probe-choice" type="button" data-probe="5"><span class="probe-dot" style="--probe-color:#28a9a2"></span>Probe 6</button>
    </div></section>
    <section class="control-section" aria-label="Chọn hướng pad name"><h2 class="section-title">Hướng pad name</h2><div class="direction-grid" id="directionGrid">
      <button class="direction-choice" type="button" data-direction="top">↑ Trên</button><button class="direction-choice" type="button" data-direction="bottom">↓ Dưới</button><button class="direction-choice" type="button" data-direction="left">← Trái</button><button class="direction-choice" type="button" data-direction="right">→ Phải</button>
    </div><div class="section-title" style="margin-top:8px">Chiều dài đường chỉ hướng (um)</div><div class="length-grid" id="lengthGrid">
      <div class="length-option"><button class="length-pick active" type="button" data-length="0">1</button><input id="length0" value="500" inputmode="decimal" aria-label="Chiều dài 1"></div>
      <div class="length-option"><button class="length-pick" type="button" data-length="1">2</button><input id="length1" value="800" inputmode="decimal" aria-label="Chiều dài 2"></div>
      <div class="length-option"><button class="length-pick" type="button" data-length="2">3</button><input id="length2" value="1100" inputmode="decimal" aria-label="Chiều dài 3"></div>
      <div class="length-option"><button class="length-pick" type="button" data-length="3">4</button><input id="length3" value="1400" inputmode="decimal" aria-label="Chiều dài 4"></div>
    </div></section>
    <div class="font-grid"><button id="editNameBtn" class="mode-button" type="button" aria-pressed="false">Chỉnh pad name</button><button id="editNumberBtn" class="mode-button" type="button" aria-pressed="false">Chỉnh pad number</button></div>
    <button id="fitBtn" class="fit" type="button">Vừa khung</button>
    <button id="exportBtn" class="export" type="button">Xuất DXF</button>
    <button id="clearBtn" class="clear" type="button">Xóa dữ liệu</button>
    <div id="status" class="status"></div>
  </aside>
  <section class="panel drawing" aria-label="Bản đồ cantilever">
    <div class="drawing-head"><h2>CAD</h2><div class="head-actions"><span id="countBadge" class="badge">0 pad</span></div></div>
    <div class="drawing-area"><canvas id="mapCanvas" aria-label="Bản đồ pad Cantilever"></canvas></div>
  </section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('mapCanvas'),ctx=canvas.getContext('2d');
const PROBES=[{name:'Probe 1',fill:'#e34b4b',aci:1},{name:'Probe 2',fill:'#3978c5',aci:5},{name:'Probe 3',fill:'#43a66b',aci:3},{name:'Probe 4',fill:'#e89932',aci:30},{name:'Probe 5',fill:'#9b64c5',aci:200},{name:'Probe 6',fill:'#28a9a2',aci:4}];
const state={pads:[],groups:[],zoom:1,panX:0,panY:0,drag:null,selected:null,filename:'',bounds:null,activeTool:null,probe:null,direction:null,selectedLength:0,editMode:null,labelHits:[]};
const mmPer={mm:1,um:.001,in:25.4,mil:.0254};
const clean=s=>String(s??'').replace(/^\uFEFF/,'').trim();
function numeric(v){let s=clean(v).replace(/\s/g,'');if(/^[-+]?\d+,\d+$/.test(s))s=s.replace(',','.');const n=Number(s);return Number.isFinite(n)?n:NaN}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(c!=='\r')cell+=c}if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(v=>clean(v)!==''))}
function headerIndex(headers,patterns,fallback){for(const p of patterns){const i=headers.findIndex(h=>p.test(clean(h).toLowerCase()));if(i>=0)return i}return fallback}
function importCSV(text,name){const rows=parseCSV(text);if(rows.length<2){setStatus('File CSV không có dữ liệu tọa độ.',true);return}const headers=rows[0];const ix=headerIndex(headers,[/^x(?:\s|\(|$)/,/^x$/],0),iy=headerIndex(headers,[/^y(?:\s|\(|$)/,/^y$/],1),inum=headerIndex(headers,[/^pad\s*number$/,/^number$/,/^pin$/],2),iname=headerIndex(headers,[/^pad\s*name$/,/^name$/,/^signal$/],3);const next=[];for(let r=1;r<rows.length;r++){const x=numeric(rows[r][ix]),y=numeric(rows[r][iy]);if(!Number.isFinite(x)||!Number.isFinite(y))continue;next.push({x,y,number:clean(rows[r][inum]??''),name:clean(rows[r][iname]??''),index:next.length,probe:null,direction:null,lengthIndex:null,nameOffset:{x:0,y:0},numberOffset:{x:0,y:0}})}if(!next.length){setStatus('Không tìm thấy cặp tọa độ X/Y hợp lệ trong CSV.',true);return}state.pads=next;state.filename=name||'CSV';state.selected=null;state.groups=makeGroups(next);$('padCount').textContent=next.length+' pad';$('countBadge').textContent=next.length+' pad';renderExcel();fit();setStatus('Đã nhập '+next.length+' pad.')}
function makeGroups(pads){const map=new Map();for(const p of pads){const m=p.name.match(/^(\d+P)/i);const key=m?m[1].toUpperCase():'Pads';if(!map.has(key))map.set(key,[]);map.get(key).push(p)}const groups=[];for(const [name,items] of map){const xs=items.map(p=>p.x),ys=items.map(p=>p.y);groups.push({name,pads:items,minX:Math.min(...xs),maxX:Math.max(...xs),minY:Math.min(...ys),maxY:Math.max(...ys)})}return groups}
function renderExcel(){const body=$('excelRows'),wrap=body.closest('.table-wrap');$('xHead').textContent='X ('+units()+')';$('yHead').textContent='Y ('+units()+')';body.replaceChildren();const rows=Math.max(state.pads.length,Math.ceil((wrap.clientHeight||640)/16));for(let i=0;i<rows;i++){const p=state.pads[i],tr=document.createElement('tr');tr.dataset.index=String(i);tr.classList.toggle('selected',i===state.selected);const values=[String(i+1),p?p.x:'',p?p.y:'',p?p.number:'',p?p.name:''];values.forEach((value,j)=>{const td=document.createElement('td');td.textContent=value;td.contentEditable='false';td.setAttribute('aria-readonly','true');tr.appendChild(td)});body.appendChild(tr)}}
function revealRow(index){const row=$('excelRows').querySelector('tr[data-index="'+index+'"]'),wrap=row?.closest('.table-wrap');if(!row||!wrap)return;const rr=row.getBoundingClientRect(),wr=wrap.getBoundingClientRect(),head=wrap.querySelector('thead').getBoundingClientRect().height;if(rr.top<wr.top+head)wrap.scrollBy({top:rr.top-wr.top-head,behavior:'smooth'});else if(rr.bottom>wr.bottom)wrap.scrollBy({top:rr.bottom-wr.bottom,behavior:'smooth'})}
function units(){return 'um'}function toMM(v){return v*(mmPer[units()]||1)}function padSize(){const side=Math.max(.001,numeric($('padSize').value)||50);return {w:side,h:side}}
function lineLength(index){return Math.max(0,numeric($('length'+(index??0)).value)||500)}
function getBounds(){if(!state.pads.length)return null;const s=padSize(),xs=state.pads.map(p=>p.x),ys=state.pads.map(p=>p.y),maxLine=Math.max(...Array.from({length:4},(_,i)=>lineLength(i))),fontMargin=Math.max(numeric($('nameTextSize').value)||100,numeric($('numberTextSize').value)||80)*10,nameShift=state.pads.reduce((m,p)=>Math.max(m,Math.hypot(p.nameOffset?.x||0,p.nameOffset?.y||0)),0),margin=Math.max(s.w*5,maxLine+fontMargin+nameShift+s.w*2),minX=Math.min(...xs)-margin,maxX=Math.max(...xs)+margin,minY=Math.min(...ys)-margin,maxY=Math.max(...ys)+margin;return {minX,maxX,minY,maxY,w:maxX-minX,h:maxY-minY}}
function resize(){const r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function view(){const r=canvas.getBoundingClientRect(),b=state.bounds;if(!b)return {scale:1,cx:r.width/2,cy:r.height/2};const fitScale=Math.min((r.width-55)/b.w,(r.height-55)/b.h);const scale=fitScale*state.zoom;return {scale,cx:r.width/2+state.panX,cy:r.height/2+state.panY}}
function screen(x,y,v){return {x:v.cx+(x-(state.bounds.minX+state.bounds.maxX)/2)*v.scale,y:v.cy-(y-(state.bounds.minY+state.bounds.maxY)/2)*v.scale}}
function groupSides(g){const w=Math.max(g.maxX-g.minX,1),h=Math.max(g.maxY-g.minY,1);return g.pads.map(p=>{const ds=[(p.x-g.minX)/w,(g.maxX-p.x)/w,(p.y-g.minY)/h,(g.maxY-p.y)/h];const k=ds.indexOf(Math.min(...ds));return {p,side:['left','right','bottom','top'][k]}})}
function draw(){const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return;ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle='#fffdf8';ctx.fillRect(0,0,r.width,r.height);state.labelHits=[];if(!state.pads.length){ctx.fillStyle='#75868a';ctx.font='13px Segoe UI,Arial';ctx.textAlign='center';ctx.fillText('',r.width/2,r.height/2);return}state.bounds=getBounds();const v=view(),s=padSize(),side=s.w*v.scale,nameUnit=Math.max(.001,numeric($('nameTextSize').value)||100),numberUnit=Math.max(.001,numeric($('numberTextSize').value)||80),namePx=nameUnit*v.scale,numberPx=numberUnit*v.scale;ctx.lineJoin='round';
 for(const g of state.groups){const a=screen(g.minX-s.w*2,g.maxY+s.w*2,v),b=screen(g.maxX+s.w*2,g.minY-s.w*2,v);ctx.strokeStyle='#d99bdd';ctx.lineWidth=1;ctx.setLineDash([5,4]);ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);ctx.setLineDash([])}
 for(const p of state.pads){const pt=screen(p.x,p.y,v),sel=state.selected===p.index,dx=p.direction==='left'?-1:p.direction==='right'?1:0,dy=p.direction==='top'?1:p.direction==='bottom'?-1:0;ctx.fillStyle=p.probe===null?'rgba(0,0,0,0)':PROBES[p.probe].fill;ctx.strokeStyle=sel?'#dfbd20':'#147c83';ctx.lineWidth=sel?2.5:1.2;ctx.fillRect(pt.x-side/2,pt.y-side/2,side,side);ctx.strokeRect(pt.x-side/2,pt.y-side/2,side,side);
 if(p.direction&&p.lengthIndex!==null){const L=lineLength(p.lengthIndex),baseX=p.x+dx*(s.w/2+L),baseY=p.y+dy*(s.w/2+L),targetX=baseX+(p.nameOffset?.x||0),targetY=baseY+(p.nameOffset?.y||0),elbowX=dx?targetX:baseX,elbowY=dx?baseY:targetY,base=screen(baseX,baseY,v),elbow=screen(elbowX,elbowY,v),target=screen(targetX,targetY,v),nameExtent=Math.max(namePx,(p.name||'').length*namePx*.6),nameGap=namePx*.45;ctx.strokeStyle='#526c73';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(pt.x+dx*side*.5,pt.y-dy*side*.5);ctx.lineTo(base.x,base.y);ctx.lineTo(elbow.x,elbow.y);ctx.lineTo(target.x,target.y);ctx.stroke();const nameCenter={x:target.x+(dx?dx*(nameExtent/2+nameGap):0),y:target.y+(dy?-dy*(nameExtent/2+nameGap):0)};ctx.fillStyle='#18313a';ctx.font=namePx+'px Segoe UI,Arial';ctx.textBaseline='middle';if(dx){ctx.textAlign=dx>0?'left':'right';ctx.fillText(p.name||'',target.x+dx*nameGap,target.y)}else{ctx.save();ctx.textAlign='center';ctx.translate(nameCenter.x,nameCenter.y);ctx.rotate(dy>0?-Math.PI/2:Math.PI/2);ctx.fillText(p.name||'',0,0);ctx.restore()}state.labelHits.push({index:p.index,kind:'name',x:nameCenter.x,y:nameCenter.y,w:dx?nameExtent:namePx*1.8,h:dx?namePx:nameExtent,points:[{x:pt.x+dx*side*.5,y:pt.y-dy*side*.5},base,elbow,target]});
 if(p.number){const numX=p.x-dx*(s.w/2+numberUnit*.7)+(p.numberOffset?.x||0),numY=p.y-dy*(s.w/2+numberUnit*.7)+(p.numberOffset?.y||0),num=screen(numX,numY,v),numExtent=Math.max(numberPx,String(p.number).length*numberPx*.6);ctx.font=numberPx+'px Segoe UI,Arial';ctx.textAlign='center';ctx.fillText(p.number,num.x,num.y);state.labelHits.push({index:p.index,kind:'number',x:num.x,y:num.y,w:numExtent+8,h:numberPx+8})}}
 }
}
function fit(){state.zoom=1;state.panX=0;state.panY=0;state.bounds=getBounds();draw()}
function setStatus(message,error=false){$('status').textContent=message;$('status').style.color=error?'#c8453c':'#75868a'}
function escapeDXF(s){return Array.from(String(s??'').replace(/[\r\n]/g,' '),ch=>{const cp=ch.codePointAt(0);if(cp<32)return ' ';if(cp===92)return '\\\\';if(cp<=126)return ch;if(cp<=65535)return '\\U+'+cp.toString(16).toUpperCase().padStart(4,'0');const n=cp-65536,hi=55296+(n>>10),lo=56320+(n&1023);return '\\U+'+hi.toString(16).toUpperCase()+'\\U+'+lo.toString(16).toUpperCase()}).join('')}

/* ================= EXPORT DXF (R12 / AC1009, ô màu bằng SOLID) ================= */
function exportDXF(){
 if(!state.pads.length){setStatus('Chưa có tọa độ để xuất DXF.',true);return}
 const s=padSize().w,
  nameSize=Math.max(.001,numeric($('nameTextSize').value)||100),
  numberSize=Math.max(.001,numeric($('numberTextSize').value)||80),
  mm=.001,bb=getBounds();

 // Số luôn ghi dạng thập phân cố định (không bao giờ ra dạng 1e-7 hay NaN)
 const num=v=>{
  if(!Number.isFinite(v))v=0;
  let t=(Math.round(v*1e6)/1e6).toFixed(6).replace(/0+$/,'').replace(/\.$/,'');
  return (t===''||t==='-0')?'0':t;
 };
 // Chữ HTML tính theo em của font (chữ hoa thật ~0.7 em); DXF TEXT height là chiều cao chữ hoa
 const TEXT_CAP=.7;
 let out='';
 const pair=(code,value)=>{out+=String(code)+'\n'+(typeof value==='number'?num(value):String(value))+'\n'};

 const line=(x1,y1,x2,y2,layer='LEADERS',aci=8,linetype='CONTINUOUS')=>{
  pair(0,'LINE');pair(8,layer);pair(62,aci);
  if(linetype!=='CONTINUOUS')pair(6,linetype);
  pair(10,x1*mm);pair(20,y1*mm);pair(30,0);
  pair(11,x2*mm);pair(21,y2*mm);pair(31,0);
 };
 const rect=(p,layer='PADS',aci=4)=>{
  const h=s/2,x=p.x,y=p.y;
  [[x-h,y-h,x+h,y-h],[x+h,y-h,x+h,y+h],[x+h,y+h,x-h,y+h],[x-h,y+h,x-h,y-h]]
   .forEach(a=>line(a[0],a[1],a[2],a[3],layer,aci));
 };
 // Ô đặc có màu probe (SOLID: thứ tự đỉnh trái-dưới, phải-dưới, trái-trên, phải-trên)
 const solid=(p,aci)=>{
  const h=s/2;
  pair(0,'SOLID');pair(8,'PROBE_'+(p.probe+1));pair(62,aci);
  [[p.x-h,p.y-h],[p.x+h,p.y-h],[p.x-h,p.y+h],[p.x+h,p.y+h]].forEach((q,i)=>{
   pair(10+i,q[0]*mm);pair(20+i,q[1]*mm);pair(30+i,0);
  });
 };
 // Hatch bằng đường gạch chéo 45° (LINE thật) để SolidWorks và các phần mềm khác vẫn nhận được
 const hatchLines=(p,aci)=>{
  const h=s/2,step=s/10,layer='PROBE_'+(p.probe+1);
  for(let c=-s+step;c<s-1e-9;c+=step){
   if(Math.abs(c)<1e-9)continue;
   if(c>0)line(p.x-h+c,p.y-h,p.x+h,p.y+h-c,layer,aci);
   else line(p.x-h,p.y-h-c,p.x+h+c,p.y+h,layer,aci);
  }
  line(p.x-h,p.y-h,p.x+h,p.y+h,layer,aci);
 };
 const txt=(text,x,y,height,rotation=0,align=1)=>{
  if(!String(text??'').trim())return;
  pair(0,'TEXT');pair(8,'PAD_LABELS');pair(62,7);
  pair(10,x*mm);pair(20,y*mm);pair(30,0);pair(40,height*mm*TEXT_CAP);
  pair(1,escapeDXF(text));pair(50,rotation);pair(7,'STANDARD');
  pair(72,align);
  pair(11,x*mm);pair(21,y*mm);pair(31,0);
  pair(73,2);
 };

 // ---------- HEADER ----------
 pair(0,'SECTION');pair(2,'HEADER');
 pair(9,'$ACADVER');pair(1,'AC1009');
 pair(9,'$EXTMIN');pair(10,bb.minX*mm);pair(20,bb.minY*mm);pair(30,0);
 pair(9,'$EXTMAX');pair(10,bb.maxX*mm);pair(20,bb.maxY*mm);pair(30,0);
 pair(9,'$LTSCALE');pair(40,1);
 pair(9,'$FILLMODE');pair(70,1);
 pair(0,'ENDSEC');

 // ---------- TABLES ----------
 pair(0,'SECTION');pair(2,'TABLES');

 const cx=(bb.minX+bb.maxX)/2*mm,cy=(bb.minY+bb.maxY)/2*mm,vh=Math.max(bb.h,bb.w/1.6)*mm*1.05;
 pair(0,'TABLE');pair(2,'VPORT');pair(70,1);
 pair(0,'VPORT');pair(2,'*ACTIVE');pair(70,0);
 pair(10,0);pair(20,0);pair(11,1);pair(21,1);
 pair(12,cx);pair(22,cy);pair(13,0);pair(23,0);pair(14,1);pair(24,1);pair(15,0);pair(25,0);
 pair(16,0);pair(26,0);pair(36,1);pair(17,0);pair(27,0);pair(37,0);
 pair(40,vh);pair(41,1.6);pair(42,50);pair(43,0);pair(44,0);pair(50,0);pair(51,0);
 pair(71,0);pair(72,100);pair(73,1);pair(74,3);pair(75,0);pair(76,0);pair(77,0);pair(78,0);
 pair(0,'ENDTAB');

 pair(0,'TABLE');pair(2,'LTYPE');pair(70,2);
 pair(0,'LTYPE');pair(2,'CONTINUOUS');pair(70,0);pair(3,'Solid line');pair(72,65);pair(73,0);pair(40,0);
 pair(0,'LTYPE');pair(2,'CM_DASHED');pair(70,0);pair(3,'Dashed');pair(72,65);pair(73,2);pair(40,.072);pair(49,.04);pair(49,-.032);
 pair(0,'ENDTAB');

 const layers=[['0',7,'CONTINUOUS'],['PADS',4,'CONTINUOUS'],['PROBE_FILL',7,'CONTINUOUS'],['PAD_LABELS',7,'CONTINUOUS'],['LEADERS',8,'CONTINUOUS'],['CONNECTOR_OUTLINE',6,'CM_DASHED']];
 PROBES.forEach((q,i)=>layers.push(['PROBE_'+(i+1),q.aci,'CONTINUOUS']));
 pair(0,'TABLE');pair(2,'LAYER');pair(70,layers.length);
 for(const [name,color,type] of layers){pair(0,'LAYER');pair(2,name);pair(70,0);pair(62,color);pair(6,type)}
 pair(0,'ENDTAB');

 pair(0,'TABLE');pair(2,'STYLE');pair(70,1);
 pair(0,'STYLE');pair(2,'STANDARD');pair(70,0);pair(40,0);pair(41,1);pair(50,0);pair(71,0);pair(42,2.5);pair(3,'txt');pair(4,'');
 pair(0,'ENDTAB');
 pair(0,'ENDSEC');

 // ---------- ENTITIES ----------
 pair(0,'SECTION');pair(2,'ENTITIES');
 for(const g of state.groups){
  const x0=g.minX-s*2,x1=g.maxX+s*2,y0=g.minY-s*2,y1=g.maxY+s*2;
  [[x0,y0,x1,y0],[x1,y0,x1,y1],[x1,y1,x0,y1],[x0,y1,x0,y0]]
   .forEach(a=>line(a[0],a[1],a[2],a[3],'CONNECTOR_OUTLINE',6,'CM_DASHED'));
 }
 for(const p of state.pads){
  const color=p.probe===null?null:PROBES[p.probe].aci;
  if(color!==null){solid(p,color);hatchLines(p,color);rect(p,'PROBE_'+(p.probe+1),color)}else rect(p);
  if(!p.direction||p.lengthIndex===null)continue;
  const dx=p.direction==='left'?-1:p.direction==='right'?1:0;
  const dy=p.direction==='top'?1:p.direction==='bottom'?-1:0;
  const L=lineLength(p.lengthIndex),x1=p.x+dx*s*.5,y1=p.y+dy*s*.5;
  const baseX=p.x+dx*(s*.5+L),baseY=p.y+dy*(s*.5+L);
  const targetX=baseX+(p.nameOffset?.x||0),targetY=baseY+(p.nameOffset?.y||0);
  const elbowX=dx?targetX:baseX,elbowY=dx?baseY:targetY;
  const nameGap=nameSize*.45,nameOffset=Math.max(nameSize,(p.name||'').length*nameSize*.6)/2+nameGap;
  line(x1,y1,baseX,baseY);line(baseX,baseY,elbowX,elbowY);line(elbowX,elbowY,targetX,targetY);
  const numX=p.x-dx*(s*.5+numberSize*.7)+(p.numberOffset?.x||0);
  const numY=p.y-dy*(s*.5+numberSize*.7)+(p.numberOffset?.y||0);
  txt(p.number,numX,numY,numberSize,0,1);
  if(dx)txt(p.name||'',targetX+dx*nameGap,targetY,nameSize,0,dx>0?0:2);
  else txt(p.name||'',targetX,targetY+dy*nameOffset,nameSize,dy>0?90:270,1);
 }
 pair(0,'ENDSEC');pair(0,'EOF');

 const blob=new Blob([out],{type:'application/dxf'}),base=(state.filename||'cantilever').replace(/\.[^.]+$/,'')+'-map-um.dxf';
 if(window.showSaveFilePicker){
  window.showSaveFilePicker({suggestedName:base,types:[{description:'DXF drawing',accept:{'application/dxf':['.dxf']}}]}).then(async handle=>{
   const writable=await handle.createWritable();await writable.write(blob);await writable.close();
   setStatus('Đã lưu DXF: '+handle.name+' (mm, tương đương tọa độ um).');
  }).catch(e=>{if(e.name!=='AbortError')setStatus('Không lưu được DXF: '+e.message,true)});
 }else{
  const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=base;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);setStatus('Đã tải DXF (tọa độ um được quy đổi sang mm).');
 }
}

function updateModeUI(){document.querySelectorAll('.probe-choice').forEach(b=>b.classList.toggle('active',state.activeTool==='probe'&&Number(b.dataset.probe)===state.probe));document.querySelectorAll('.direction-choice').forEach(b=>b.classList.toggle('active',state.activeTool==='direction'&&b.dataset.direction===state.direction));document.querySelectorAll('.length-pick').forEach(b=>b.classList.toggle('active',Number(b.dataset.length)===state.selectedLength));$('editNameBtn').classList.toggle('active',state.editMode==='name');$('editNumberBtn').classList.toggle('active',state.editMode==='number');$('editNameBtn').setAttribute('aria-pressed',String(state.editMode==='name'));$('editNumberBtn').setAttribute('aria-pressed',String(state.editMode==='number'));canvas.style.cursor=state.editMode?'move':'grab'}
function chooseProbe(i){state.editMode=null;state.activeTool='probe';state.probe=i;updateModeUI();setStatus('Đã chọn '+PROBES[i].name+'.')}
function chooseDirection(d){state.editMode=null;state.activeTool='direction';state.direction=d;updateModeUI();setStatus('Đã chọn hướng '+({top:'trên',bottom:'dưới',left:'trái',right:'phải'}[d])+'.')}
function chooseLength(i){state.editMode=null;state.selectedLength=i;state.activeTool='length';updateModeUI();setStatus('Chiều dài '+(i+1)+': '+lineLength(i)+' '+units())}
function toggleEdit(mode){state.editMode=state.editMode===mode?null:mode;state.activeTool=null;updateModeUI();setStatus(state.editMode==='name'?'Chỉnh pad name':state.editMode==='number'?'Chỉnh pad number':'')}
function padAt(clientX,clientY){if(!state.pads.length)return null;const r=canvas.getBoundingClientRect(),v=view(),x=clientX-r.left,y=clientY-r.top;let best=null,dist=Infinity;for(const p of state.pads){const q=screen(p.x,p.y,v),d=(q.x-x)**2+(q.y-y)**2;if(d<dist){dist=d;best=p}}return dist<24**2?best:null}
function showSelected(p){state.selected=p.index;renderExcel();revealRow(p.index)}
function selectAt(clientX,clientY){const p=padAt(clientX,clientY);if(!p)return;showSelected(p);if(state.activeTool==='probe'&&state.probe!==null){p.probe=state.probe;setStatus(p.number+' · '+PROBES[state.probe].name)}else if(state.activeTool==='direction'&&state.direction){if(p.direction===state.direction){p.direction=null;p.lengthIndex=null;setStatus('Đã bỏ hướng pad name của pad '+p.number+'.')}else{p.direction=state.direction;p.lengthIndex=state.selectedLength;setStatus('Đã đặt hướng pad name '+state.direction+' cho pad '+p.number+'.')}}else if(state.activeTool==='length'){p.lengthIndex=state.selectedLength;setStatus('Đã áp dụng chiều dài mức '+(state.selectedLength+1)+' cho pad '+p.number+'.')}draw()}
function clearPadAssignment(clientX,clientY){const p=padAt(clientX,clientY);if(!p)return;showSelected(p);if(state.activeTool==='probe'){p.probe=null;setStatus('Đã bỏ phân loại Probe của pad '+p.number+'.')}else if(state.activeTool==='direction'){p.direction=null;p.lengthIndex=null;setStatus('Đã bỏ hướng pad name và đường dẫn của pad '+p.number+'.')}else if(state.activeTool==='length'){p.lengthIndex=null;setStatus('Đã bỏ đường dẫn của pad '+p.number+'.')}else return;draw()}
function segmentDistance(x,y,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy||1))),px=a.x+t*dx,py=a.y+t*dy;return Math.hypot(x-px,y-py)}
function labelHit(clientX,clientY,kind){const r=canvas.getBoundingClientRect(),x=clientX-r.left,y=clientY-r.top;for(let i=state.labelHits.length-1;i>=0;i--){const h=state.labelHits[i];if(h.kind!==kind)continue;const inside=Math.abs(x-h.x)<=Math.max(9,h.w/2)&&Math.abs(y-h.y)<=Math.max(9,h.h/2),onLine=kind==='name'&&h.points?.some((p,j)=>j&&segmentDistance(x,y,h.points[j-1],p)<8);if(inside||onLine)return h}return null}
function beginLabelDrag(hit,e){const p=state.pads[hit.index],key=hit.kind==='name'?'nameOffset':'numberOffset',offset=p[key]||{x:0,y:0};showSelected(p);state.drag={type:'label',kind:hit.kind,index:hit.index,key,startX:e.clientX,startY:e.clientY,scale:view().scale,initial:{x:offset.x,y:offset.y},moved:false};canvas.setPointerCapture(e.pointerId)}
document.querySelectorAll('.probe-choice').forEach(b=>b.addEventListener('click',()=>chooseProbe(Number(b.dataset.probe))));document.querySelectorAll('.direction-choice').forEach(b=>b.addEventListener('click',()=>chooseDirection(b.dataset.direction)));document.querySelectorAll('.length-pick').forEach(b=>b.addEventListener('click',()=>chooseLength(Number(b.dataset.length))));$('editNameBtn').addEventListener('click',()=>toggleEdit('name'));$('editNumberBtn').addEventListener('click',()=>toggleEdit('number'));$('excelRows').addEventListener('click',e=>{const tr=e.target.closest('tr[data-index]'),i=Number(tr?.dataset.index);if(tr&&Number.isInteger(i)&&state.pads[i]){showSelected(state.pads[i]);draw()}});
canvas.addEventListener('pointerdown',e=>{if(state.editMode){const hit=labelHit(e.clientX,e.clientY,state.editMode);if(hit){beginLabelDrag(hit,e);return}}canvas.setPointerCapture(e.pointerId);state.drag={type:'pan',x:e.clientX,y:e.clientY,panX:state.panX,panY:state.panY,moved:false}});canvas.addEventListener('pointermove',e=>{if(!state.drag)return;const dx=e.clientX-state.drag.x,dy=e.clientY-state.drag.y;if(state.drag.type==='label'){const d=state.drag,mx=e.clientX-d.startX,my=e.clientY-d.startY;if(Math.abs(mx)+Math.abs(my)>2)d.moved=true;const p=state.pads[d.index],ox=d.initial.x+mx/d.scale,oy=d.initial.y-my/d.scale;if(d.key==='numberOffset'){const limit=padSize().w*2,len=Math.hypot(ox,oy),ratio=len>limit?limit/len:1;p[d.key]={x:ox*ratio,y:oy*ratio}}else{const limit=Math.max(...Array.from({length:4},(_,i)=>lineLength(i)))*3,len=Math.hypot(ox,oy),ratio=len>limit?limit/len:1;p[d.key]={x:ox*ratio,y:oy*ratio}}draw();return}if(Math.abs(dx)+Math.abs(dy)>3)state.drag.moved=true;if(state.drag.moved){state.panX=state.drag.panX+dx;state.panY=state.drag.panY+dy;canvas.classList.add('dragging');draw()}});canvas.addEventListener('pointerup',e=>{const d=state.drag;if(d?.type==='pan'&&!d.moved)selectAt(e.clientX,e.clientY);state.drag=null;canvas.classList.remove('dragging')});canvas.addEventListener('dblclick',e=>{e.preventDefault();if(!state.editMode)clearPadAssignment(e.clientX,e.clientY)});canvas.addEventListener('wheel',e=>{e.preventDefault();const old=state.zoom;state.zoom=Math.min(80,Math.max(.05,old*Math.exp(-e.deltaY*.001)));draw()},{passive:false});
$('csvFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{importCSV(await f.text(),f.name)}catch(err){setStatus('Không đọc được CSV: '+err.message,true)}});$('fitBtn').addEventListener('click',fit);$('exportBtn').addEventListener('click',exportDXF);$('clearBtn').addEventListener('click',()=>{state.pads=[];state.groups=[];state.selected=null;state.activeTool=null;state.editMode=null;state.filename='';$('csvFile').value='';$('padCount').textContent='0 pad';$('countBadge').textContent='0 pad';updateModeUI();renderExcel();fit();setStatus('')});$('padSize').addEventListener('input',draw);$('nameTextSize').addEventListener('input',draw);$('numberTextSize').addEventListener('input',draw);for(let i=0;i<4;i++)$('length'+i).addEventListener('input',draw);updateModeUI();renderExcel();window.addEventListener('resize',()=>{renderExcel();resize()});resize();
})();
</script>
