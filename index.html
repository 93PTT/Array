<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#147c83">
  <title>Array</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #294347;
      background: #f8f2e8;
      --ink: #294347;
      --teal: #5a9eae;
      --teal-bright: #7bb8c4;
      --teal-deep: #397783;
      --deep-bright: #5a9eae;
      --leaf: #668f65;
      --leaf-bright: #89b387;
      --orange: #df7140;
      --orange-bright: #ef9568;
      --gold: #dfbd63;
      --gold-bright: #efd681;
      --cream: #fffaf0;
      --line: #e5ddca;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 150px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f8f2e8;
    }

    main {
      width: min(100%, 520px);
      transform: translateY(-118px);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .tile {
      min-height: 96px;
      display: grid;
      place-items: center;
      padding: 14px;
      border: 2px solid var(--tile-accent);
      border-radius: 12px;
      background: var(--tile-accent);
      color: var(--tile-text);
      font-size: clamp(21px, 3vw, 28px);
      font-weight: 750;
      letter-spacing: .02em;
      text-decoration: none;
      box-shadow: 0 5px 0 #29434712;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease, background-color .16s ease, color .16s ease;
    }

    .tile:first-child {
      --tile-accent: var(--leaf);
      --tile-bright: var(--leaf-bright);
      --tile-text: #fffdf8;
    }

    .tile:nth-child(2) {
      --tile-accent: var(--orange);
      --tile-bright: var(--orange-bright);
      --tile-text: #fffdf8;
    }

    .tile:nth-child(3) {
      --tile-accent: var(--teal-deep);
      --tile-bright: var(--deep-bright);
      --tile-text: #fffdf8;
    }

    .tile:nth-child(4) {
      --tile-accent: var(--gold);
      --tile-bright: var(--gold-bright);
      --tile-text: #294347;
    }

    .tile:hover,
    .tile:focus-visible {
      transform: translateY(-3px);
      border-color: var(--tile-bright);
      background: var(--tile-bright);
      color: #294347;
      box-shadow: 0 8px 0 #29434720;
      outline: none;
    }

    .tile:active {
      transform: translateY(0);
      box-shadow: 0 2px 0 #2943471c;
    }

    @media (max-width: 520px) {
      body {
        padding: 20px;
      }

      main {
        transform: translateY(-100px);
      }

      .menu-grid {
        gap: 10px;
      }

      .tile {
        min-height: 88px;
        padding: 10px 8px;
        border-radius: 10px;
      }
    }
  </style>
</head>
<body>
  <main aria-label="PadPlot modules">
    <nav class="menu-grid" aria-label="Chọn chức năng">
      <a class="tile" href="array.html">Array</a>
      <div class="tile">Dut</div>
      <div class="tile">Compare</div>
      <div class="tile">Offset</div>
    </nav>
  </main>
</body>
</html>
